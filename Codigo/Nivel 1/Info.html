<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DF · Defendiendo la Justicia</title>
<link rel="stylesheet" href="Pantalla.titulo.css">
</head>
<body>
    <!-- ============ INFORMACIÓN DEL CASO ============ -->
  <div class="app-frame">
  <div class="screen active" id="screen-nivel-titulo">
    <div class="topbar">
      <button class="icon-btn" data-back>←</button>
      <h1>INFORMACIÓN DEL CASO</h1>
      <div style="width:34px"></div>
    </div>
    <div class="folder-row">
      <div class="folder" onclick="irATestimonios()"><span class="icon">📁</span><span class="name">Testimonios</span></div>
      <div class="folder" onclick="irADenuncia()"><span class="icon">📁</span><span class="name">Denuncia</span></div>
      <div class="folder" onclick="irAPruebas()"><span class="icon">📁</span><span class="name">Pruebas</span></div>
    </div>
    <p class="body-text">En cada carpeta habrá información acerca del juicio. Cuando hayas leído todos los documentos tocá el botón con la flechita para empezar.</p>
    <button class="arrow-fab" onclick="irAEscena()">→</button>
  </div>
  </div>
  </div>
  <script>
    /*Redireccionamientos
    irAEscena = va a la pantalla EscenaJuicio.html
    irAPruebas = va a la pantalla Pruebas.html
    irATestimonios = va a la pantalla Testimonios.html
    irADenuncia = va a la pantalla Denuncia.html*/
    function irAEscena(){
      window.location.href = "EscenaJuicio.html";
    }
    function irAPruebas(){
      window.location.href = "Pruebas.html";
    }
    function irATestimonios(){
      window.location.href = "Testimonios.html";
    }
    function irADenuncia(){
      window.location.href = "Denuncia.html";
    }
  </script>
</body>
</html>
