
<!DOCTYPE html>
<!-- Declara que este documento utiliza HTML5 -->

<html lang="es">
<!-- Indica que el idioma de la página es español -->

<head>
    <!-- Configuración general de la página -->

    <meta charset="UTF-8">
    <!-- Permite mostrar correctamente tildes, ñ y símbolos -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Adapta la página al tamaño de la pantalla -->

    <title>DF · Defendiendo la Justicia</title>
    <!-- Título que aparece en la pestaña del navegador -->

    <!-- Conecta este HTML con tu archivo CSS -->
    <link rel="stylesheet" href="../Style.css">

</head>

<body>
    <!-- Contiene todo lo que se muestra en pantalla -->

    <div class="app-frame">
        <!-- Marco exterior de la aplicación -->

        <div class="screen active"
             id="screen-nivel-titulo"
             style="
                background-image: url('../Imagenes/Primer_fondo.png');
                background-size: cover;
                background-position: center center;
                background-repeat: no-repeat;
             ">
            <!--
                Pantalla inicial del nivel.

                background-image: establece la imagen de fondo.
                background-size: cover: cubre toda la pantalla.
                background-position: center center: centra la imagen.
                background-repeat: evita que la imagen se repita.
            -->

            <div class="center titulo-contenedor">
                <!--
                    Contenedor del título.
                    La clase titulo-contenedor nos permitirá
                    centrar el cartel horizontal y verticalmente.
                -->

                <div class="level-banner">
                    <!-- Cartel decorativo del título del nivel -->

                    <h1>LA EMPRESA ECOLÓGICA</h1>
                    <!-- Nombre del nivel -->

                </div>
                <!-- Fin del cartel -->

            </div>
            <!-- Fin del contenedor del título -->

            <button
                class="btn btn-primary"
                data-goto="screen-nivel-desc">
                CONTINUAR
            </button>
            <!--
                Botón para continuar a la siguiente pantalla.
                data-goto indica el identificador de la pantalla
                a la que se quiere avanzar.
            -->

        </div>
        <!-- Fin de la pantalla del título -->

    </div>
    <!-- Fin del marco de la aplicación -->

</body>
</html>
