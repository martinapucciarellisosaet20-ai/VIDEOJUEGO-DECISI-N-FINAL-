<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DF · Defendiendo la Justicia</title>
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/screens.css">
<link rel="stylesheet" href="../css/game.css">

<body>
<div class="viewport">
<main class="stage">
<a class="img-btn btn-back" data-nav="back" data-i18n-aria="volver"><img src="../assets/icons/flecha.png" alt="←"></a>
<h1 class="title sm" data-i18n="soporte">SOPORTE</h1>
<div class="sup-block sup-1"><div class="sup-q" data-i18n="faq1q"></div><p class="text" data-i18n="faq1a"></p></div>
<div class="sup-block sup-2"><div class="sup-q" data-i18n="faq2q"></div><p class="text" data-i18n="faq2a"></p></div>
<button class="btn sup-btn" id="btn-contacto" data-i18n="contactanos">CONTACTANOS</button>
<div class="modal-backdrop hidden" id="modal-contacto">
  <div class="modal">
    <h2 data-i18n="contactanos">CONTACTANOS</h2>
    <label class="text" for="mensaje" data-i18n="mensaje">Tu mensaje:</label>
    <textarea id="mensaje" data-i18n-ph="phMensaje"></textarea>
    <div class="row">
      <button class="btn dark" id="cerrar-contacto" data-i18n="cerrar">CERRAR</button>
      <button class="btn" id="enviar-contacto" data-i18n="enviar">ENVIAR</button>
    </div>
  </div>
</div>
</main>
</div>
<script src="../js/data/niveles.js"></script>
